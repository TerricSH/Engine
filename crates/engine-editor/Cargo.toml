[package]
name = "engine-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
tooling-editor = ["dep:engine-audio", "dep:engine-terrain"]

[dependencies]
engine-animation = { path = "../engine-animation" }
engine-character = { path = "../engine-character" }
engine-asset = { path = "../engine-asset" }
engine-audio = { path = "../engine-audio", optional = true }
engine-nav = { path = "../engine-nav" }
engine-physics = { path = "../engine-physics" }
engine-renderer = { path = "../engine-renderer" }
engine-scene = { path = "../engine-scene" }
engine-serialize = { path = "../engine-serialize" }
engine-ui = { path = "../engine-ui" }
engine-terrain = { path = "../engine-terrain", optional = true }
glam.workspace = true
ron.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
