[package]
name = "engine-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
subsystem-scripting-csharp = ["dep:engine-script"]
gameplay = ["dep:engine-physics", "dep:engine-gameplay"]
backend-vulkan = ["dep:render-vulkan", "dep:raw-window-handle"]
runtime-subsystems = [
    "dep:engine-animation",
    "dep:engine-audio",
    "dep:engine-nav",
    "dep:engine-ui",
]
runtime-audio-output = ["runtime-subsystems", "engine-audio/subsystem-audio-cpal"]
terrain = ["dep:engine-terrain"]

[dependencies]
engine-asset = { path = "../engine-asset" }
engine-renderer = { path = "../engine-renderer" }
engine-scene = { path = "../engine-scene" }
engine-script = { path = "../engine-script", optional = true }
engine-serialize = { path = "../engine-serialize" }
engine-ffi = { path = "../engine-ffi" }
engine-character = { path = "../engine-character" }
engine-animation = { path = "../engine-animation", optional = true }
engine-audio = { path = "../engine-audio", optional = true }
engine-nav = { path = "../engine-nav", optional = true }
engine-physics = { path = "../engine-physics", optional = true }
engine-gameplay = { path = "../engine-gameplay", optional = true }
engine-ui = { path = "../engine-ui", optional = true }
engine-terrain = { path = "../engine-terrain", optional = true }
render-vulkan = { path = "../render-vulkan", optional = true }
raw-window-handle = { workspace = true, optional = true }
tracing.workspace = true
glam.workspace = true

[dev-dependencies]
bincode.workspace = true
