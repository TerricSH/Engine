[package]
name = "engine-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
subsystem-scripting-csharp = ["dep:engine-script", "dep:serde_json"]
subsystem-animation = ["dep:engine-animation"]
subsystem-audio = ["dep:engine-audio"]
subsystem-navigation = ["dep:engine-nav"]
subsystem-ui = ["dep:engine-ui"]
subsystem-physics = ["dep:engine-physics"]
subsystem-gameplay = ["dep:engine-gameplay"]
subsystem-terrain = ["dep:engine-terrain"]
# Compatibility profiles. New runtime code should gate against the leaf
# subsystem features above instead of these aggregate aliases.
runtime-subsystems = [
    "subsystem-animation",
    "subsystem-audio",
    "subsystem-navigation",
    "subsystem-ui",
]
gameplay = ["subsystem-physics", "subsystem-gameplay"]
runtime-audio-output = ["subsystem-audio", "engine-audio/subsystem-audio-cpal"]
terrain = ["subsystem-terrain"]

[dependencies]
engine-asset = { path = "../engine-asset" }
engine-renderer = { path = "../engine-renderer" }
engine-scene = { path = "../engine-scene" }
engine-script = { path = "../engine-script", optional = true }
engine-serialize = { path = "../engine-serialize" }
engine-ffi = { path = "../engine-ffi" }
engine-character = { path = "../engine-character" }
engine-animation = { path = "../engine-animation", optional = true }
engine-audio = { path = "../engine-audio", optional = true }
engine-nav = { path = "../engine-nav", optional = true }
engine-physics = { path = "../engine-physics", optional = true }
engine-gameplay = { path = "../engine-gameplay", optional = true }
engine-vfx = { path = "../engine-vfx" }
engine-ui = { path = "../engine-ui", optional = true }
engine-terrain = { path = "../engine-terrain", optional = true }
tracing.workspace = true
glam.workspace = true
bincode.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
