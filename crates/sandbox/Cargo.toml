[package]
name = "sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
backend-vulkan = ["dep:render-vulkan"]
subsystem-animation = ["engine-core/subsystem-animation"]
subsystem-audio = ["engine-core/subsystem-audio"]
subsystem-navigation = ["engine-core/subsystem-navigation"]
subsystem-ui = ["engine-core/subsystem-ui", "dep:engine-ui"]
subsystem-physics = ["engine-core/subsystem-physics"]
subsystem-gameplay = ["engine-core/subsystem-gameplay"]
subsystem-terrain = ["engine-core/subsystem-terrain", "dep:engine-terrain"]
subsystem-network = ["engine-core/subsystem-network", "dep:engine-network"]
subsystem-xr = ["engine-core/subsystem-xr", "dep:engine-xr"]
runtime-subsystems = [
    "subsystem-animation",
    "subsystem-audio",
    "subsystem-navigation",
    "subsystem-ui",
]
runtime-audio-output = ["engine-core/runtime-audio-output"]
tooling-editor = [
    "engine-editor/tooling-editor",
    "dep:engine-editor",
    "dep:engine-editor-host",
    "subsystem-scripting-csharp",
    "runtime-subsystems",
    "terrain",
]
terrain = ["subsystem-terrain"]
target-desktop = [
    "subsystem-physics",
    "subsystem-gameplay",
    "subsystem-network",
    "subsystem-xr",
    "runtime-subsystems",
    "runtime-audio-output",
]
target-mobile = []
subsystem-scripting-csharp = [
    "engine-core/subsystem-scripting-csharp",
    "subsystem-gameplay",
    "dep:engine-script",
]

[dependencies]
engine-animation = { path = "../engine-animation" }
engine-asset = { path = "../engine-asset" }
engine-character = { path = "../engine-character" }
engine-core = { path = "../engine-core" }
engine-terrain = { path = "../engine-terrain", optional = true }
engine-network = { path = "../engine-network", optional = true }
engine-xr = { path = "../engine-xr", optional = true }
engine-ui = { path = "../engine-ui", optional = true }
engine-gameplay = { path = "../engine-gameplay" }
engine-physics = { path = "../engine-physics" }
engine-editor = { path = "../engine-editor", optional = true }
engine-editor-host = { path = "../engine-editor-host", optional = true }
engine-renderer = { path = "../engine-renderer" }
engine-scene = { path = "../engine-scene" }
engine-script = { path = "../engine-script", optional = true }
engine-script-api = { path = "../engine-script-api" }
engine-serialize = { path = "../engine-serialize" }
bincode.workspace = true
glam.workspace = true
gltf.workspace = true
platform = { path = "../platform" }
ron.workspace = true
render-vulkan = { path = "../render-vulkan", optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true
urlencoding.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
tempfile = "3"

[dev-dependencies]
engine-audio = { path = "../engine-audio" }
engine-nav = { path = "../engine-nav" }
engine-terrain = { path = "../engine-terrain" }
engine-ui = { path = "../engine-ui" }
engine-vfx = { path = "../engine-vfx" }
image.workspace = true

# Soak harness working-set sampling (ENG-71): process memory counters for the
# memory-plateau assertion. Windows-only, test-only.
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[build-dependencies]
serde_json.workspace = true
sha2.workspace = true
