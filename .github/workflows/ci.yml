name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: pwsh

jobs:
  rust-quality:
    name: Rust quality and tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format
        run: ./.github/scripts/ci.ps1 -Task Format
      - name: Clippy (warnings are errors)
        run: ./.github/scripts/ci.ps1 -Task Clippy
      - name: Windows Vulkan/editor/C# feature wiring
        run: ./.github/scripts/ci.ps1 -Task FeatureCheck
      - name: Workspace tests
        run: ./.github/scripts/ci.ps1 -Task Test
      - name: Fixed glTF resource-chain fixture
        run: ./.github/scripts/ci.ps1 -Task Fixture
      - name: Create, validate, run, and cook a game project
        run: ./.github/scripts/ci.ps1 -Task ProjectWorkflow
      - name: Headless scene and game-project QA
        run: ./.github/scripts/ci.ps1 -Task Qa
      - name: Archive soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report-windows
          path: target/soak/soak-report.json
          if-no-files-found: ignore

  rust-quality-linux:
    name: Linux core tests (non-GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all -- --check
      # The full workspace builds headlessly on Linux except
      # engine-editor-host, which requires wry/tao + webkit2gtk (editor UI)
      # and stays Windows-only. Vulkan device tests, DX12, and the editor
      # feature set remain covered by the Windows gates.
      - name: Clippy (core crates, warnings are errors)
        run: cargo clippy --workspace --exclude engine-editor-host --all-targets --locked -- -D warnings
      - name: Production crates deny unwrap
        run: cargo clippy --workspace --exclude engine-editor-host --lib --bins --locked -- -D warnings -D clippy::unwrap_used
      - name: Core workspace tests
        run: cargo test --workspace --exclude engine-editor-host --locked
      - name: Terrain/gameplay feature tests
        run: cargo test -p engine-core --features terrain,gameplay --locked
      - name: Terrain/gameplay panic-safety Clippy
        run: cargo clippy -p engine-core --features terrain,gameplay --lib --locked -- -D warnings -D clippy::unwrap_used
      - name: Archive soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report-linux
          path: target/soak/soak-report.json
          if-no-files-found: ignore

  managed-interop:
    name: C# Release build and native ABI smoke
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and smoke-test managed hosts
        run: ./.github/scripts/ci.ps1 -Task Managed

  shaders:
    name: GLSL compile and SPIR-V validation
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned shader tools
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.3.296.0
          vulkan-components: Glslang,SPIRV-Tools
          vulkan-use-cache: true
      - name: Compile GLSL and validate fresh and checked-in SPIR-V
        run: ./.github/scripts/verify-shaders.ps1

  release-build:
    name: Locked Windows Release build
    needs: [rust-quality, managed-interop, shaders]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build the workspace and Vulkan desktop sandbox in Release mode
        run: ./.github/scripts/ci.ps1 -Task Release
